<script src="assets/wil.js?v=202607311505"></script>

  mountFooter();

             en:'Workation Insight Quarterly Report Vol.1 — Where and How Much Is Spent on Workation (1Q Consumption Theme)',

           en:'WIL’s inaugural quarterly report — B2B/B2C usage trends, a W2BI index snapshot, and an in-depth spending analysis',
           ja:'B2B/B2C利用動向・W2BI指数スナップショット・消費深堀分析を収録したWIL定例レポート創刊号',
           zh:'收录B2B/B2C使用趋势、W2BI指数快照及消费深度分析的WIL定期报告创刊号'}},
    {cat:'INDEX', date:'2026.07', done:true,
     title:{ko:'워케이션 시설의 기업 요구사항 만족 지수(W2BI) 진단 기준 명세서 &amp; 직영 시설 2차 진단 결과',
             en:'Workation Facility Corporate-Requirement Fit Index (W2BI) Diagnosis Spec &amp; 2nd-Round Directly-Operated Facility Results',
             ja:'ワーケーション施設の企業要求事項満足指数(W2BI)診断基準仕様書 &amp; 直営施設第2次診断結果',
             zh:'工作度假设施企业需求满足指数(W2BI)诊断标准说明书 &amp; 直营设施第二次诊断结果'},
     desc:{ko:'11개 직영 워케이션 시설 · 12개 항목 채점 · 프로그램 유형별 해당 판정',
           en:'11 directly-operated workation facilities · 12-item scoring · program-type fit judgment',
           ja:'直営ワーケーション施設11拠点・12項目採点・プログラムタイプ別該当判定',
           zh:'11家直营工作度假设施·12项评分·各项目类型适配判定'}},
    {cat:'ACADEMIC', date:'2026.07', done:true,
     title:{ko:'워케이션의 지역 경제 파급 효과: 실결제 데이터 기반 실증 연구 계획서',
             en:'Regional Economic Impact of Workation: Real-Payment-Data-Based Empirical Research Plan',
             ja:'ワーケーションの地域経済波及効果：実決済データに基づく実証研究計画書',
             zh:'工作度假的地区经济波及效应：基于实际支付数据的实证研究计划书'},
     desc:{ko:'카드 승인 내역 연동 및 캐시백 리워드 메커니즘 설계',
           en:'Card-approval data integration and cashback reward mechanism design',
           ja:'カード承認履歴連携及びキャッシュバックリワードメカニズム設計',
           zh:'信用卡授权记录对接及返现奖励机制设计'}},
    {cat:'ACADEMIC', date:'2026.07', done:true,
     title:{ko:'K-관광 산업 대전환 공동 프로젝트 협업계획서 — 산학 공동 연구 로드맵',
             en:'K-Tourism Industry Transformation Joint Project Collaboration Plan — Academic-Industry Research Roadmap',
             ja:'K-観光産業大転換共同プロジェクト協業計画書－産学共同研究ロードマップ',
             zh:'K-旅游产业大转型联合项目合作计划书——产学联合研究路线图'},
     desc:{ko:'동덕여자대학교 · 경기대학교 공동 연구 거버넌스 및 연도별 로드맵',
           en:'Dongduk Women’s University · Kyonggi University joint-research governance and yearly roadmap',
           ja:'同徳女子大学・京畿大学共同研究ガバナンス及び年度別ロードマップ',
           zh:'同德女子大学·京畿大学联合研究治理及年度路线图'}},
    {cat:'REPORT', date:'2026.11', done:false,
     title:{ko:'워케이션 데이터 포럼 — 기존 체류 데이터 기반 1차 실증 수치 발표',
             en:'Workation Data Forum — 1st Empirical Findings Based on Existing Stay Data',
             ja:'ワーケーションデータフォーラム－既存滞在データに基づく第1次実証数値発表',
             zh:'工作度假数据论坛——基于现有停留数据的第一次实证数据发布'},
     desc:{ko:'체류 박수·시설별 이용 패턴·기업 이용 비중 등 선행 지표 공개',
           en:'Publishing preliminary indicators: stay-nights, per-facility usage patterns, corporate-usage share',
           ja:'滞在泊数・施設別利用パターン・企業利用比率など先行指標を公開',
           zh:'公开住宿间夜数·各设施使用模式·企业使用占比等先行指标'}},
    {cat:'DATA', date:'2027.1Q', done:false,
     title:{ko:'K-워케이션 생활인구 소비지출액 통계 — 신용카드 실측 1차 파일럿',
             en:'K-Workation Living-Population Spending Statistics — 1st Credit-Card Measurement Pilot',
             ja:'K-ワーケーション生活人口消費支出額統計－クレジットカード実測第1次パイロット',
             zh:'K-工作度假生活人口消费支出统计——信用卡实测第一期试点'},
     desc:{ko:'1인 1박당 실제 소비지출액 및 업종별 소비 구조 최초 실측',
           en:'First measurement of actual per-guest-night spending and spending structure by industry',
           ja:'1人1泊あたりの実際の消費支出額及び業種別消費構造の初測定',
           zh:'首次实测每人每晚实际消费支出及各行业消费结构'}},
    {cat:'INDEX', date:'2027.4Q', done:false,
     title:{ko:'K-Workation 종합 경쟁력 지수 2027 &amp; 2028 전망',
             en:'K-Workation Composite Competitiveness Index — 2027 &amp; 2028 Outlook',
             ja:'K-Workation総合競争力指数 2027 &amp; 2028年展望',
             zh:'K-Workation综合竞争力指数 2027 &amp; 2028年展望'},
     desc:{ko:'경제효과·품질·수요잠재력·수용성 종합 지수 및 차년도 전망',
           en:'Composite index of economic impact, quality, demand potential, and acceptance, with next-year outlook',
           ja:'経済効果・品質・需要潜在力・受容性の総合指数及び次年度展望',
           zh:'经济效应·品质·需求潜力·接受度综合指数及下一年度展望'}}
  ];

  const CATS = ['전체', ...[...new Set(REPORTS.map(r => r.cat))]];
  let currentFilter = '전체';

  function renderTabs(){
    document.getElementById('catTabs').innerHTML = CATS.map((c, i) =>
      `<button class="tab cat-${c.toLowerCase()}${c === currentFilter ? ' on' : ''}" data-cat="${c}">${c === '전체' ? (t('research.tabAll') || c) : c}</button>`).join('');
  }
  function renderList(filter){
    currentFilter = filter;
    const items = filter === '전체' ? REPORTS : REPORTS.filter(r => r.cat === filter);
    const lang = getLang();
    document.getElementById('rlist').innerHTML = items.map(r => {
      const downloadBtn = (r.file && r.done)
        ? `<a href="${r.file}" class="rdownload" download>${t('research.download') || 'PDF 다운로드'}</a>`
        : '';
      const inner = `
        <span class="rcat cat-${r.cat.toLowerCase()}">${r.cat}</span>
        <div class="rbody"><h5>${r.title[lang] || r.title.ko}</h5><p>${r.desc[lang] || r.desc.ko}</p></div>
        <div class="rtail">${downloadBtn}<div class="rdate"><b>${r.date}</b><span class="rstat ${r.done ? 'done' : 'plan'}">${r.done ? (t('research.statDone') || '발행 완료') : (t('research.statPlan') || '발행 예정')}</span></div></div>`;
      if (r.file && r.done) {
        return `<div class="ritem">${inner}</div>`;
      }
      return `<a href="mailto:research@dearmonday.io" class="ritem">${inner}</a>`;
    }).join('');
  }
  renderTabs();
  renderList('전체');
  document.getElementById('catTabs').addEventListener('click', e => {
    const btn = e.target.closest('.tab');
    if (!btn) return;
    document.querySelectorAll('#catTabs .tab').forEach(el => el.classList.toggle('on', el === btn));
    renderList(btn.dataset.cat);
  });
  I18N_RERENDERS.push(() => { renderTabs(); renderList(currentFilter); });
</script>
</body>
</html>
